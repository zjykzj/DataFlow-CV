[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-cv"
version = "2.0.1"
description = "A computer vision dataset processing library — analyse, convert, visualize, and evaluate annotations across YOLO, LabelMe, and COCO formats"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DataFlow-CV Team"}
]
keywords = ["computer-vision", "dataset", "annotation", "label", "labelme", "yolo", "coco"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.6.0.66",
    "click>=8.0.0",
]

[project.optional-dependencies]
coco = ["pycocotools>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16",
    "mypy>=1.0.0",
]
[project.urls]
"Bug Reports" = "https://github.com/zjykzj/DataFlow-CV/issues"
"Source" = "https://github.com/zjykzj/DataFlow-CV"

[project.scripts]
dataflow-cv = "dataflow.cli.main:cli"

[tool.setuptools]
include-package-data = true
zip-safe = false
packages = {find = {where = ["."], include = ["dataflow", "dataflow.*"]}}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_coco: marks tests that require pycocotools",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "samples/",
]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E203: black-compatible whitespace (flake8 heritage)
# E501: line length is the formatter's job (ruff format enforces 100)
ignore = ["E203", "E501"]